schema_version: "1.1"
name: branch-name-from-request
tags: [branch]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Start a branch for ABC-123: lock out login after 5 failed attempts"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 15
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?branch"'
  - name: named-by-convention
    type: regex
    target: { source: file, path: .git/HEAD }
    pattern: '^ref: refs/heads/feat/abc-123-[a-z0-9]+(-[a-z0-9]+){1,3}\s*$'
  - name: off-up-to-date-default
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '^[0-9a-f]{40} 7369280e781a67e7f6dbd16b24f893460c223208 [^\n]*\tcheckout: moving from [^\n]* to feat/abc-123-'
    flags: m
  - name: no-upstream-to-default
    type: regex
    target: { source: file, path: .git/config }
    pattern: '\[branch "feat/abc-123[^"]*"\][^\[]*merge = refs/heads/trunk'
    match: not_contains
  - name: keeps-uncommitted-work
    type: regex
    target: { source: file, path: login.js }
    pattern: '// TODO: rate limit'
