schema_version: "1.1"
name: branch-name-taken
tags: [branch]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Start branch feat/abc-123-login-lockout for ABC-123"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 15
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?branch"'
  - name: stays-on-main
    type: regex
    target: { source: file, path: .git/HEAD }
    pattern: '^ref: refs/heads/main\s*$'
  - name: no-local-branch
    type: file_exists
    path: .git/logs/refs/heads/feat/abc-123-login-lockout
    exists: false
  - name: asks
    type: regex
    pattern: '\?(?![A-Za-z0-9=&%#/])'
