    - "cd /repo\ngit add -A"
    - 'git commit -m "docs: x" -a'
    - git -c core.autocrlf=false add README.md
    - git -c user.name=x -C . add .
    - git --no-pager add -p
    - "git commit -q -m 'x' -a"
    - 'git commit -m "x" --all'
    - git add README.md
    - git add -A
    - cd "/tmp/e-1/work" && git add .
    - git -C . add README.md
    - git stage README.md
    - 'git commit -qam "docs: x"'
    - 'git commit -am "docs: x"'
    - 'git commit --all -m "docs: x"'
