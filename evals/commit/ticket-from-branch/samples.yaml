never-stages:
  pass:
    - git status --short
    - git diff --cached
    - git log -1 --format=%B
    - |-
      git commit -F - <<'EOF'
      feat(PROJ-142): Lock out login after 5 failed attempts

      - Stop brute-force guessing of user passwords

      Co-Authored-By: Claude Opus 5.5, high effort, 2026-10-11
      EOF
    - 'git commit -m "fix -a flag parsing"'
    - 'git commit --amend -m "x"'
    - 'git commit --allow-empty -m "x"'
    - git log --all --oneline
    - |-
      git commit -F - <<'EOF'
      feat: drop -a support

      - Stop -a from staging
      EOF
  fail:
    - "cd /repo\ngit add -A"
    - 'git commit -m "feat(PROJ-142): x" -a'
    - git -c core.autocrlf=false add src/login.js
    - git -c user.name=x -C . add .
    - git --no-pager add -p
    - "git commit -q -m 'x' -a"
    - 'git commit -m "x" --all'
    - git add src/login.js
    - 'git add -A && git commit -m "feat(PROJ-142): x"'
    - cd "/tmp/e-1/work" && git add notes.txt
    - git -C . add notes.txt
    - git stage notes.txt
    - 'git commit -qam "feat(PROJ-142): x"'
    - 'git commit -a -m "feat(PROJ-142): x"'
    - 'git commit --all -m "feat(PROJ-142): x"'
