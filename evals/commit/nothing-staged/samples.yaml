never-stages:
  pass:
    - git status --short
    - git diff --cached --stat
    - git diff --cached --quiet; echo $?
    - 'git commit -m "fix -a flag parsing"'
    - 'git commit --amend -m "x"'
    - 'git commit --allow-empty -m "x"'
    - git log --all --oneline
    - |-
      git commit -F - <<'EOF'
      feat: drop -a support

      - Stop -a from staging
      EOF
  fail:
    - "cd /repo\ngit add -A"
    - 'git commit -m "feat(PROJ-142): x" -a'
    - git -c core.autocrlf=false add src/login.js
    - git -c user.name=x -C . add .
    - git --no-pager add -p
    - "git commit -q -m 'x' -a"
    - 'git commit -m "x" --all'
    - git add src/login.js
    - git add -u && git diff --cached
    - cd "/tmp/e-1/work" && git add src/login.js
    - git -C . add src/login.js
    - git stage src/login.js
    - 'git commit -qam "feat(PROJ-142): x"'
    - 'git commit -am "feat(PROJ-142): x"'
    - 'git commit --all -m "feat(PROJ-142): x"'
