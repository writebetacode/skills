says-nothing-staged:
  pass:
    - Nothing is staged, so I didn't commit. Stage what you want in this commit (e.g. `git add src/login.js`) and ask again.
    - "No changes are staged: `src/login.js` is modified but not staged. Stage it and I'll commit."
    - There's nothing to commit yet; stage your changes first.
  fail:
    - "Committed `feat(PROJ-142): Lock out login after 5 failed attempts`."
    - I staged src/login.js and committed it as feat(PROJ-142).
    - The working tree has an unstaged edit to src/login.js. Want me to stage it?
