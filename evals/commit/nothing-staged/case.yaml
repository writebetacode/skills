schema_version: "1.1"
name: commit-nothing-staged
tags: [commit]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "commit"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 15
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?commit"'
  - name: never-stages
    type: regex
    target: trace
    pattern: '"command":\s*"(?:[^"\\]|\\.)*\bgit (?:-[cC] \S+ |--[\w-]+(?:=\S+)? )*(?:add|stage|commit(?: (?:\\"(?:[^"\\]|\\[^"])*\\"|''[^'']*''|[^\s"''\\;&|]+))*? (?:-[a-z]*a[a-z]*|--all)\b)'
    match: not_contains
  - name: no-new-commit
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit(: | \(amend\))'
    match: not_contains
  - name: says-nothing-staged
    type: regex
    pattern: 'nothing (is )?staged|no staged|not staged|nothing to commit|no changes (are )?staged'
    flags: i
