schema_version: "1.1"
name: recap-writes-daily-note
tags: [recap, voice]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "recap what I did on 2026-10-12"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 15
  env:
    EVAL_SESSIONS_DIR: .sessions
  # Eval runs don't load a fixture's CLAUDE.md; this stands in for the user's global one.
  append_system_prompt: |
    Contents of /Users/dev/.claude/CLAUDE.md (user's private global instructions for all projects):

    ## Recap
    - File: vault/Daily/{date}.md, under `## Claude`
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?recap"'
  - name: voice-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?voice"'
  - name: block-under-heading
    type: regex
    target: { source: file, path: vault/Daily/2026-10-12.md }
    pattern: '^## Claude\s*\n\s*<!-- recap:start -->\s*\n\s*- [\s\S]*?<!-- recap:end -->\s*\n+## Gym'
    flags: m
  - name: keeps-rest
    type: regex
    target: { source: file, path: vault/Daily/2026-10-12.md }
    pattern: '^# 2026-10-12\s*\n[\s\S]*^## Gym\s*\n- Legs\s*$'
    flags: m
  - name: names-pr
    type: regex
    target: { source: file, path: vault/Daily/2026-10-12.md }
    pattern: '#142\b|pull/142\b'
  - name: names-commit
    type: regex
    target: { source: file, path: vault/Daily/2026-10-12.md }
    pattern: 'README|install'
    flags: i
  - name: skips-other-day
    type: regex
    target: { source: file, path: vault/Daily/2026-10-12.md }
    pattern: 'invoice'
    flags: i
    match: not_contains
  - name: no-em-dash
    type: regex
    target: { source: file, path: vault/Daily/2026-10-12.md }
    pattern: '—|\s–\s'
    match: not_contains
