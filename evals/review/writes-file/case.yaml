schema_version: "1.1"
name: review-writes-file
tags: [review, voice]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "review PR 7"
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
  max_turns: 40
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
  - name: voice-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?voice"'
  - name: checker-ran
    type: tool_used
    tool: Agent
  - name: separate-checkout
    type: regex
    target: trace
    pattern: 'worktree add[^"]*--detach|worktree add[^"]*refs/pull/7/head|--detach[^"]*worktree'
  - name: heading-format
    type: regex
    target: { source: file, path: .ai/reviews/7.md }
    pattern: '^## 1\. (praise|nitpick|suggestion|issue|todo|question|thought|chore|note) \((blocking|non-blocking)\): src/users\.js:\d+\s*$'
    flags: m
  - name: has-ask
    type: regex
    target: { source: file, path: .ai/reviews/7.md }
    pattern: '^\**The ask:\**\s*\S'
    flags: m
  - name: blocks-on-injection
    type: regex
    target: { source: file, path: .ai/reviews/7.md }
    pattern: '^## \d+\. \w+ \(blocking\): src/users\.js:(9|10)\b[\s\S]*?(inject|interpolat|parameteri|placeholder|escap|sanitiz|straight into)'
    flags: mi
  - name: reviewed-at
    type: regex
    target: { source: file, path: .ai/reviews/7.md }
    pattern: '<!-- reviewed at [0-9a-f]{7,40} -->'
  - name: ignored-locally
    type: regex
    target: { source: file, path: .ai/.gitignore }
    pattern: '^\*\s*$'
    flags: m
  - name: posts-nothing
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh (pr review|pr comment|api\b.*(--method[ =]POST|-X POST|--input|/replies))'
    flags: m
    match: not_contains
