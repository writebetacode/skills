schema_version: "1.1"
name: review-posts-file
tags: [review]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "post the review for PR 7"
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
  max_turns: 25
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
  - name: no-re-review
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: one-batched-review
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh api\b.*pulls/7/reviews'
    flags: m
  - name: posts-active-findings
    type: regex
    target: { source: file, path: .fake-gh/api-inputs.log }
    pattern: 'review:1 -->[\s\S]*review:2 -->|review:2 -->[\s\S]*review:1 -->'
  - name: conventional-body
    type: regex
    target: { source: file, path: .fake-gh/api-inputs.log }
    pattern: 'issue \(blocking\): Could a name like'
  - name: skips-withdrawn
    type: regex
    target: { source: file, path: .fake-gh/api-inputs.log }
    pattern: 'review:3\b|searchUsers'
    match: not_contains
  - name: comment-event
    type: regex
    target: { source: file, path: .fake-gh/api-inputs.log }
    pattern: '"event"\s*:\s*"COMMENT"'
  - name: no-summary
    type: regex
    target: { source: file, path: .fake-gh/api-inputs.log }
    pattern: '^  "body"\s*:|\{"commit_id"[^\[]*"body"\s*:'
    flags: m
    match: not_contains
  - name: records-posted
    type: regex
    target: { source: file, path: .ai/reviews/7.md }
    pattern: '^posted: \d{4}-\d{2}-\d{2}\b'
    flags: m
