schema_version: "1.1"
name: research-fix-does-not-trigger
tags: [research]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Login accepts a 1-character password. Make the minimum 12, like signup."
  allowed_tools: [Skill, Read, Grep, Glob]
graders:
  - name: research-not-fired
    type: tool_used
    tool: Skill
    input_match: 'research'
    min: 0
    max: 0
    arm: both
  - name: makes-the-fix
    type: regex
    target: { source: file, path: src/forms/login.ts }
    pattern: '\b12\b|signup'
    flags: i
  - name: drops-min-1
    type: regex
    target: { source: file, path: src/forms/login.ts }
    pattern: 'min\(1\)'
    match: not_contains
