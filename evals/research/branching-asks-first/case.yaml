schema_version: "1.1"
name: research-branching-asks-first
tags: [research, same-page]
execution:
  prompt: "Use the research skill: look into our logging"
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
graders:
  - name: research-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research"'
  - name: same-page-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?same-page"'
  - name: no-lookups-before-confirming
    type: regex
    target: trace
    pattern: '"name":\s*"(Read|Grep|Glob|Agent|Bash)"'
    match: not_contains
  - name: no-report-yet
    type: regex
    pattern: '## Answer'
    match: not_contains
