schema_version: "1.1"
name: voice-explain-terse
tags: [voice]
execution:
  prompt: |
    The sdlc-build skill just replied:

    Task 01-cart-total. ACs: Empty cart totals zero → test/cart.test.js:12 ✓. Files: src/cart.js, test/cart.test.js. Review: r1 2→0; disputed: none. Look it over; say go to commit.

    explain that in plain english
  allowed_tools: [Skill, Read, Grep, Glob]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?voice"'
  - name: no-lookups
    type: regex
    target: trace
    pattern: '"name":\s*"(Read|Grep|Glob|Bash|Agent)"'
    match: not_contains
  - name: no-shorthand
    type: regex
    pattern: '→|✓|\br1\b'
    match: not_contains
  - name: no-em-dash
    type: regex
    pattern: '—|\s–\s'
    match: not_contains
  - name: no-stock-phrases
    type: regex
    pattern: '\b(Certainly|Absolutely|Great question|I hope this helps|Let me know if|In summary)\b'
    flags: i
    match: not_contains
  - name: says-next-step
    type: regex
    pattern: '\bgo\b'
    flags: i
  - name: under-120-words
    type: regex
    pattern: '^\s*(?:\S+\s+){120}\S'
    match: not_contains
