schema_version: "1.1"
name: prompt-writer-write-skill-file
tags: [prompt-writer]
execution:
  prompt: "Use the prompt-writer skill to create skills/greet/SKILL.md: a skill that greets the user by name in one short sentence. Both Claude and the user can invoke it."
  allowed_tools: [Skill, Read, Grep, Glob]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?prompt-writer"'
  - name: reads-skill-rules
    type: tool_used
    tool: Read
    input_match: 'skill-file\.md'
  - name: rules-before-write
    type: tool_order
    before: { tool: Read, input_match: 'skill-file\.md' }
    after: Write
  - name: file-written
    type: file_exists
    path: skills/greet/SKILL.md
  - name: frontmatter
    type: regex
    target: { source: file, path: skills/greet/SKILL.md }
    pattern: '^---\s*\n[\s\S]*?name: greet[\s\S]*?description:'
  - name: no-invocation-flags
    type: regex
    target: { source: file, path: skills/greet/SKILL.md }
    pattern: 'user-invocable|disable-model-invocation'
    match: not_contains
  - name: reply-is-just-the-path
    type: regex
    pattern: '^\s*(?:\S+\s+){40}\S'
    match: not_contains
