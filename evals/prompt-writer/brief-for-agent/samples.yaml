writes-no-files:
  pass:
    - { tool: Skill, input: { skill: prompt-writer } }
    - { tool: Read, input: { file_path: /repo/src/app.ts } }
    - grep -rn "TODO" src/
  fail:
    - { tool: Write, input: { file_path: brief.md, content: "List every TODO comment under src/ as file:line: text." } }
    - { tool: Edit, input: { file_path: brief.md, old_string: "TODO", new_string: "TODO comment" } }
no-preamble:
  pass:
    - |-
      List every TODO comment under src/, recursively. Read only; change nothing.
      One line each, sorted by path: `path:line: comment text`. Nothing else.
  fail:
    - |-
      Here's the brief:

      List every TODO comment under src/. One line each: `path:line: comment text`.
    - "Sure. List every TODO comment under src/ as `path:line: text`."
    - "  Below is a brief for the subagent:\n\nList every TODO under src/."
    - "I'll keep it short:\n\nList every TODO comment under src/ as `path:line: text`."
    - "I will brief it like this: list every TODO under src/."
under-100-words:
  pass:
    - |-
      List every TODO comment under src/, recursively. Read only; change nothing.
      One line each, sorted by path: `path:line: comment text`. Nothing else.
  fail:
    - |-
      You are a subagent helping with a codebase audit. Your job is to search through every file in the src/ directory, including all nested subdirectories, and find each comment that contains the word TODO. For every match you find, output the relative file path, a colon, the line number, another colon, and then the full text of the comment. Do not modify any files. Do not include matches from outside src/. If you find nothing, say so clearly. Sort your results by file path, then by line number. Treat block comments that span several lines as a single match, and report the line where the comment starts. Skip vendored and generated folders such as node_modules and dist.
