schema_version: "1.1"
name: pr-open-fallback-format
tags: [pr]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "open a PR"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 25
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr"'
  - name: fallback-title
    type: regex
    target: { source: file, path: .fake-gh/pr-title }
    pattern: '^feat\(#142\)!: [A-Z][^\n]*\n?$'
  - name: checks-issue
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh issue view 142\b'
    flags: m
  - name: default-template
    type: regex
    target: { source: file, path: .fake-gh/pr-body.md }
    pattern: '<!-- pr-body:start -->\s*## Tickets\s*- \[#142\]\(https://github\.com/acme/shop/issues/142\) Report sections are hard to scan\s*## Summary\s*\S[^\n]*\s*## Changes\s*(- `[^`\n]+`: [^\n]+\s*)+<!-- pr-body:end -->'
