schema_version: "1.1"
name: pr-open-matches-repo-style
tags: [pr, voice]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "open a PR"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 25
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr"'
  - name: pushed-branch
    type: file_exists
    path: .remote.git/logs/refs/heads/feat/abc-123-login-lockout
  - name: title-in-repo-style
    type: regex
    target: { source: file, path: .fake-gh/pr-title }
    pattern: '^\[ABC-123\] [A-Z][^\n]*\n?$'
  - name: fills-repo-template
    type: regex
    target: { source: file, path: .fake-gh/pr-body.md }
    pattern: '<!-- pr-body:start -->[\s\S]*## What[\s\S]*## Why[\s\S]*## Testing[\s\S]*<!-- pr-body:end -->'
  - name: assigned-to-user
    type: regex
    target: { source: file, path: .fake-gh/pr-assignee }
    pattern: '^(@me|dev)\s*$'
  - name: no-attribution
    type: regex
    target: { source: file, path: .fake-gh/pr-body.md }
    pattern: 'Co-Authored-By|Generated with|Claude'
    match: not_contains
  - name: never-force-pushes
    type: regex
    target: trace
    pattern: '"command":\s*"(?:[^"\\]|\\.)*(?:\\n|\b)git push\b(?:[^"\;&|]|\\.)*(?:--force|\s-f\b)'
    match: not_contains
