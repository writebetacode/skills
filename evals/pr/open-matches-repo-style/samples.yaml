    - "cd /repo\ngit push --force origin HEAD"
    - git push --force -u origin feat/abc-123-login-lockout
    - git push --force-with-lease origin feat/abc-123-login-lockout
    - git push -f origin feat/abc-123-login-lockout
    - cd "/tmp/e/cwd" && git push -u -f origin HEAD
