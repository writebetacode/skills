fills-repo-template:
  pass:
    - |
      <!-- pr-body:start -->
      ## What
      Lock an account for further attempts after 5 failed logins; a correct password resets the count.

      ## Why
      - ABC-123: stop brute-force guessing of user passwords.

      ## Testing
      - `src/login.test.js`: lockout after 5 failures, reset on success.
      <!-- pr-body:end -->
