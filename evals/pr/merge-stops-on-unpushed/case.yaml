schema_version: "1.1"
name: pr-merge-stops-on-unpushed
tags: [pr]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "merge the PR"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 25
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr"'
  - name: no-merge
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh pr merge'
    flags: m
    match: not_contains
  - name: keeps-local-commit
    type: regex
    target: { source: file, path: .git/HEAD }
    pattern: '^ref: refs/heads/fix/142-null-cart-total\s*$'
  - name: says-unpushed
    type: regex
    pattern: 'unpushed|not (been )?pushed|ahead of|push (it|them|that|this)?\s*first|only (exists?|lives?) locally|isn''t on (the remote|origin|GitHub)'
    flags: i
