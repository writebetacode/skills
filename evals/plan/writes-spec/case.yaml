schema_version: "1.1"
name: plan-writes-spec
tags: [plan, voice]
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Use the plan skill for ABC-77. We're past same-page:
    Agreed request: Lock an account for 15 minutes after 5 failed logins in a row. While it's locked, even the right password is refused, and the web login form says "Account locked. Try again in N minutes." A successful login resets the count.
    Examples: 4 bad tries, then a 5th → locked; right password while locked → refused.
    Clarified: per account, not per IP; keep the count on the user's row; no unlock email.
    Research is saved under .ai/plan/login-lockout/research/. Carry on.
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 25
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan"'
  - name: voice-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?voice"'
  - name: spec-written
    type: file_exists
    path: .ai/plan/login-lockout/spec.md
  - name: old-spec-made-true
    type: regex
    target: { source: file, path: docs/specs/login.md }
    pattern: 'retry as often as they like|retries are never refused'
    flags: i
    match: not_contains
  - name: old-spec-kept
    type: regex
    target: { source: file, path: docs/specs/login.md }
    pattern: '^# Sign in with email and password\s*$'
    flags: m
  - name: no-ticket-or-research-refs
    type: regex
    target: { source: file, path: .ai/plan/login-lockout/spec.md }
    pattern: 'ABC-77|research/|login-today'
    flags: i
    match: not_contains
  - name: gherkin-scenarios
    type: regex
    target: { source: file, path: .ai/plan/login-lockout/spec.md }
    pattern: '```gherkin\s*\n\s*Scenario'
  - name: decisions-section
    type: regex
    target: { source: file, path: .ai/plan/login-lockout/spec.md }
    pattern: '^## Decisions\s*$'
    flags: m
  - name: no-code
    type: regex
    target: { source: file, path: .ai/plan/login-lockout/spec.md }
    pattern: '```(?!gherkin)\w'
    match: not_contains
  - name: waits-for-approval
    type: regex
    target: { source: file, path: .ai/plan/login-lockout/status.md }
    pattern: 'spec: approved'
    match: not_contains
  - name: no-tasks-yet
    type: regex
    target: trace
    pattern: 'tasks/0'
    match: not_contains
  - name: asks-to-approve
    type: regex
    pattern: 'approv'
    flags: i
