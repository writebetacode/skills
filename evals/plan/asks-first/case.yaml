schema_version: "1.1"
name: plan-asks-first
tags: [plan, same-page]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "checkout totals look wrong, can you figure out why?"
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
  max_turns: 15
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan"'
  - name: same-page-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?same-page"'
  - name: no-lookups-yet
    type: regex
    target: trace
    pattern: '"name":\s*"(Read|Grep|Glob|Agent|Bash|Write|Edit)"'
    match: not_contains
  - name: under-130-words
    type: regex
    pattern: '^\s*(?:\S+\s+){130}\S'
    match: not_contains
  - name: asks
    type: regex
    pattern: '\?(?![A-Za-z0-9=&%#/])'
