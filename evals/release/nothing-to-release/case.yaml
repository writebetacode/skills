schema_version: "1.1"
name: release-nothing-to-release
tags: [release]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "release"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 20
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?release"'
  - name: says-nothing-to-release
    type: regex
    pattern: 'nothing to release|no release (is )?needed|nothing (here )?(warrants|needs) a (new )?(version|release)'
    flags: i
  - name: changelog-unchanged
    type: regex
    target: { source: file, path: CHANGELOG.md }
    pattern: '^## (?!0\.1\.0 )'
    flags: m
    match: not_contains
  - name: plugin-unchanged
    type: regex
    target: { source: file, path: .claude-plugin/plugin.json }
    pattern: '"version":\s*"0\.1\.0"'
  - name: no-branch
    type: regex
    target: { source: file, path: .git/HEAD }
    pattern: '^ref: refs/heads/main\s*$'
