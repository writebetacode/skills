schema_version: "1.1"
name: release-prepares-changelog
tags: [release, branch, voice]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "release"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 25
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?release"'
  - name: voice-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?voice"'
  - name: branch-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?branch"'
  - name: on-release-branch
    type: regex
    target: { source: file, path: .git/HEAD }
    pattern: '^ref: refs/heads/chore/release-v0\.2\.0\s*$'
  - name: version-heading
    type: regex
    target: { source: file, path: CHANGELOG.md }
    pattern: '^## 0\.2\.0 — \d{4}-\d{2}-\d{2}\s*$'
    flags: m
  - name: bold-title-under-heading
    type: regex
    target: { source: file, path: CHANGELOG.md }
    pattern: '^## 0\.2\.0[^\n]*\n\n?\*\*[^*\n]+\*\*[ \t]*\n'
    flags: m
  - name: compare-link
    type: regex
    target: { source: file, path: CHANGELOG.md }
    pattern: '\[v0\.1\.0\.\.\.v0\.2\.0\]\(https://github\.com/acme/shop/compare/v0\.1\.0\.\.\.v0\.2\.0\)'
  - name: grouped-oldest-first
    type: regex
    target: { source: file, path: CHANGELOG.md }
    pattern: '### Breaking\s+- feat!: Rename[^\n]*\s+### Features\s+- feat: Add commit skill[^\n]*\s+### Fixes\s+- fix\(#123\): Cite[^\n]*\s+### Other\s+- docs: Explain[^\n]*\s+- chore: Ignore'
  - name: skips-merge-commits
    type: regex
    target: { source: file, path: CHANGELOG.md }
    pattern: 'Merge pull request'
    match: not_contains
  - name: linked-hashes
    type: regex
    target: { source: file, path: CHANGELOG.md }
    pattern: '^- (?![^\n]*\(\[[0-9a-f]{7,12}\]\(https://github\.com/acme/shop/commit/[0-9a-f]{40}\)\)\s*$)'
    flags: m
    match: not_contains
  - name: plugin-version
    type: regex
    target: { source: file, path: .claude-plugin/plugin.json }
    pattern: '"version":\s*"0\.2\.0"'
  - name: package-version
    type: regex
    target: { source: file, path: package.json }
    pattern: '"version":\s*"0\.2\.0"'
  - name: lockfile-version
    type: regex
    target: { source: file, path: package-lock.json }
    pattern: '^(?![\s\S]*"0\.1\.0")[\s\S]*"version":\s*"0\.2\.0"'
  - name: no-commit-yet
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcheckout: moving from [^\n]* to chore/release-v0\.2\.0\n$'
  - name: not-pushed
    type: file_exists
    path: .remote.git/logs/refs/heads/chore/release-v0.2.0
    exists: false
