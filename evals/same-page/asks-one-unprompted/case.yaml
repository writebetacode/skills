schema_version: "1.1"
name: same-page-asks-one-unprompted
tags: [same-page]
execution:
  prompt: "I want to add rate limiting to our API. Before you start anything, find out from me everything you need to know."
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
  max_turns: 10
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?same-page"'
  - name: one-question
    type: regex
    pattern: '\?(?![A-Za-z0-9=&%#/])[\s\S]*\?(?![A-Za-z0-9=&%#/])'
    match: not_contains
  - name: asks
    type: regex
    pattern: '\?(?![A-Za-z0-9=&%#/])'
