under-130-words:
  pass:
    - |-
      You want responses from the API cached so that repeated requests skip the database and return faster. For example, GET /products/42 would be served from cache for 60 seconds, while POST /orders would never be cached.

      Another example that would expose a misreading: GET /cart/7 is per-user, so caching it shared across users would leak data. I'd leave per-user endpoints out unless you say otherwise.

      The one question that would most change my read: should every GET endpoint be cached, or only a few hot read paths like /products? My guess is only the hot read paths, with a short TTL such as 60 seconds, invalidated on writes to the same resource, since that gives most of the speedup with the least risk of stale data.
  fail:
    - |-
      You want responses from the API cached so that repeated requests skip the database and return faster. For example, GET /products/42 would be served from cache for 60 seconds, while POST /orders would never be cached because writes must always reach the database.

      Another example that would expose a misreading: GET /cart/7 is per-user, so caching it in a cache shared across all users would leak one user's cart to another. I'd leave per-user endpoints out of the cache unless you say otherwise, and I'd key anything user-specific by user ID.

      The one question that would most change my read: should every GET endpoint be cached, or only a few hot read paths like /products and /categories? My guess is only the hot read paths, with a short TTL such as 60 seconds, invalidated whenever a write touches the same resource, since that gives most of the speedup with the least risk of serving stale data to customers.
