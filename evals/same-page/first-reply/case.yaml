schema_version: "1.1"
name: same-page-first-reply
tags: [same-page]
execution:
  prompt: "Use the same-page skill on this request: add caching to the API"
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?same-page"'
  - name: no-lookups
    type: regex
    target: trace
    pattern: '"name":\s*"(Read|Grep|Glob|Agent|Bash)"'
    match: not_contains
  - name: not-confirmed-yet
    type: regex
    pattern: 'Agreed request:'
    match: not_contains
  - name: asks
    type: regex
    pattern: '\?(?![A-Za-z0-9=&%#/])'
  - name: max-two-question-marks
    type: regex
    pattern: '\?(?![A-Za-z0-9=&%#/])[\s\S]*\?(?![A-Za-z0-9=&%#/])[\s\S]*\?(?![A-Za-z0-9=&%#/])'
    match: not_contains
  - name: under-130-words
    type: regex
    pattern: '^\s*(?:\S+\s+){130}\S'
    match: not_contains
