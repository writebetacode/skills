schema_version: "1.1"
name: build-land-fixes-ci
tags: [build, review]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "get PR 7 green"
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
  max_turns: 40
  timeout_seconds: 600
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?build"'
  - name: reads-ci-log
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh run view \S+.*--log-failed'
    flags: m
  - name: fixes-code
    type: regex
    target: { source: file, path: src/cart.js }
    pattern: 'return null'
    match: not_contains
  - name: keeps-test
    type: regex
    target: { source: file, path: test/cart.test.js }
    pattern: 'assert\.strictEqual\(total\(\[\]\), 0\)'
  - name: no-commit-yet
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit(?: \(initial\))?: '
    match: count:2
  - name: not-pushed
    type: regex
    target: { source: file, path: .remote.git/logs/refs/heads/fix/142-empty-cart-total }
    pattern: '^[0-9a-f]{40} '
    flags: m
    match: count:1
  - name: never-merges
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh pr merge'
    flags: m
    match: not_contains
  - name: asks-for-go
    type: regex
    pattern: '\bgo\b'
    flags: i
