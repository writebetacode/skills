schema_version: "1.1"
name: build-stops-for-review
tags: [build, branch, review]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "build the empty-cart-total plan"
  allowed_tools: [Skill, Read, Grep, Glob, Agent]
  max_turns: 40
  timeout_seconds: 600
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?build"'
  - name: branch-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?branch"'
  - name: on-task-branch
    type: regex
    target: { source: file, path: .git/HEAD }
    pattern: '^ref: refs/heads/fix/142-empty-cart-total\s*$'
  - name: test-before-code
    type: regex
    target: trace
    pattern: '^(?:(?!"name":\s*"(?:Edit|Write)"[^\n]*?test/cart\.test\.js|>>? ?[^"\s]*test/cart\.test\.js)[\s\S])*?"name":\s*"(?:Edit|Write)"[^\n]*?src/cart\.js'
    match: not_contains
  - name: makes-the-fix
    type: regex
    target: { source: file, path: src/cart.js }
    pattern: 'return null'
    match: not_contains
  - name: fresh-agent-review
    type: tool_used
    tool: Agent
    input_match: 'review'
  - name: no-commit
    type: regex
    target: { source: file, path: .git/logs/HEAD }
    pattern: '\tcommit: '
    match: not_contains
  - name: ac-not-ticked-yet
    type: regex
    target: { source: file, path: .ai/plan/empty-cart-total/tasks/01-cart-total.md }
    pattern: '^- \[ \] Empty cart totals zero\s*$'
    flags: m
  - name: status-building
    type: regex
    target: { source: file, path: .ai/plan/empty-cart-total/status.md }
    pattern: '^- 01-cart-total: building\s*$'
    flags: m
  - name: asks-for-go
    type: regex
    pattern: '\bgo\b'
    flags: i
