schema_version: "1.1"
name: ticket-jira-search
tags: [ticket]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "what open bugs are in the SHOP jira project?"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 15
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ticket"'
  - name: searches-capped
    type: regex
    target: { source: file, path: .fake-acli/calls.log }
    pattern: '^acli jira workitem search\b(?=.*--limit[ =]20\b)(?=.*(?:--jql|-j)[ =]["'']?[^\n]*project\s*=\s*"?SHOP\b)(?=.*\b(?:type|issuetype)\s*=\s*"?Bug\b)'
    flags: mi
  - name: read-only
    type: regex
    target: { source: file, path: .fake-acli/calls.log }
    pattern: '^acli jira workitem (create|edit|assign|comment|transition|link)\b'
    flags: m
    match: not_contains
  - name: lists-results
    type: regex
    pattern: '^(?=[\s\S]*SHOP-12\b)(?=[\s\S]*SHOP-15\b)'
