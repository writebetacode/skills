schema_version: "1.1"
name: ticket-asks-tracker
tags: [ticket]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "file a ticket: searching for 'café' finds nothing, but 'cafe' finds the café listings"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 15
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ticket"'
  - name: creates-nothing
    type: regex
    target: trace
    pattern: '"command":\s*"(?:[^"\\]|\\.)*?(?:\\n|\b)(gh issue create|glab issue create|acli jira workitem create)\b'
    match: not_contains
  - name: asks-offering-origin-host
    type: regex
    pattern: 'GitHub[^?.]{0,200}\?|\b([Ww]hich|[Ww]hat) tracker\b[^\n]{0,200}GitHub|GitHub[^.\n]{0,120}\bor (GitLab|Jira)\b'
