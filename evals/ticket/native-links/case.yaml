schema_version: "1.1"
name: ticket-native-links
tags: [ticket, voice]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "file a github issue under #40, blocked by #50: shoppers lose their saved cart when they switch from phone to laptop"
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 20
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ticket"'
  - name: native-parent
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh issue create\b.*--parent[ =]#?40\b'
    flags: m
  - name: native-blocked-by
    type: regex
    target: { source: file, path: .fake-gh/calls.log }
    pattern: '^gh issue create\b.*--blocked-by[ =]#?50\b'
    flags: m
  - name: no-link-lines
    type: regex
    target: { source: file, path: .fake-gh/issue-body.md }
    pattern: '^\W*(Parent|Blocked by|Part of)\W'
    flags: mi
    match: not_contains
